project_name: "FinGuard — Banking Fraud Detection & Financial Risk Analytics"
dataset:
  file_name: "creditcard.csv"
  expected_columns:
    - "Time"
    - "V1"
    - "V2"
    - "V3"
    - "V4"
    - "V5"
    - "V6"
    - "V7"
    - "V8"
    - "V9"
    - "V10"
    - "V11"
    - "V12"
    - "V13"
    - "V14"
    - "V15"
    - "V16"
    - "V17"
    - "V18"
    - "V19"
    - "V20"
    - "V21"
    - "V22"
    - "V23"
    - "V24"
    - "V25"
    - "V26"
    - "V27"
    - "V28"
    - "Amount"
    - "Class"
  target_column: "Class"
  positive_label: 1
  negative_label: 0
  raw_dir: "data/raw"
  processed_dir: "data/processed"
  export_dir: "data/exports"
  reports_dir: "reports"
  models_dir: "models"
ml:
  random_seed: 42
  test_size: 0.2
  stratify: true
  threshold_candidates:
    - 0.3
    - 0.4
    - 0.5
    - 0.6
    - 0.7
    - 0.8
  primary_metric: "precision_recall_f1"
  metrics:
    - "precision"
    - "recall"
    - "f1"
    - "roc_auc"
    - "average_precision"
    - "specificity"
    - "false_positive_rate"
